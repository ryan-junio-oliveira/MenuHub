services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-80}:80"
    environment:
      APP_ENV: production
      APP_DEBUG: false
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/database/database.sqlite
      APP_URL: ${APP_URL}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: database
    volumes:
      - storage_data:/var/www/storage
      - database_data:/var/www/database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  storage_data:
  database_data:
